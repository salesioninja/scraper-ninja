# Agência Ninja — Nginx Reverse Proxy & Dashboard Server
server {
    listen 80;
    server_name localhost;
    client_max_body_size 100m;
    root /usr/share/nginx/html;

    # Resolver DNS do Docker interno para Swarm (evita falha na inicialização)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $scraper_backend "http://scraper:8080";

    # Gzip para carregar os recursos do dashboard ultra rápido
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Healthcheck para Swarm / Docker
    location = /healthz {
        access_log off;
        return 200 "ninja-ok\n";
    }

    # Dashboard Principal da Agência Ninja
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Arquivos estáticos do frontend (CSS, JS, Assets)
    location ~* \.(css|js|png|jpg|jpeg|svg|gif|ico|woff2?|ttf)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Interface antiga / fallback
    location /classic/ {
        rewrite ^/classic/(.*) /$1 break;
        proxy_pass $scraper_backend;
        include /etc/nginx/conf.d/scraper-proxy.inc;
    }
    location = /classic {
        return 301 /classic/;
    }

    # API REST do Scraper (jobs, status, download)
    location /api/ {
        proxy_pass $scraper_backend;
        include /etc/nginx/conf.d/scraper-proxy.inc;
    }

    location /jobs {
        proxy_pass $scraper_backend;
        include /etc/nginx/conf.d/scraper-proxy.inc;
    }

    location /download {
        proxy_pass $scraper_backend;
        include /etc/nginx/conf.d/scraper-proxy.inc;
    }

    location /scrape {
        proxy_pass $scraper_backend;
        include /etc/nginx/conf.d/scraper-proxy.inc;
    }

    location /delete {
        proxy_pass $scraper_backend;
        include /etc/nginx/conf.d/scraper-proxy.inc;
    }

    location /static/ {
        proxy_pass $scraper_backend;
        include /etc/nginx/conf.d/scraper-proxy.inc;
    }
}
