# Agência Ninja — Nginx Reverse Proxy & Dashboard Server
server {
    listen 80;
    server_name localhost;
    client_max_body_size 100m;
    root /usr/share/nginx/html;

    # Resolver DNS do Docker interno para Swarm (evita falha na inicialização)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $scraper_backend "http://scraper:8080";

    # Gzip para carregar os recursos do dashboard ultra rápido
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Healthcheck para Swarm / Docker
    location = /healthz {
        access_log off;
        return 200 "ninja-ok\n";
    }

    # Dashboard Principal da Agência Ninja
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Arquivos estáticos do frontend (CSS, JS, Assets)
    location ~* \.(css|js|png|jpg|jpeg|svg|gif|ico|woff2?|ttf)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Interface antiga / fallback
    location /classic/ {
        rewrite ^/classic/(.*) /$1 break;
        proxy_pass $scraper_backend;
        include /etc/nginx/conf.d/scraper-proxy.inc;
    }
    location = /classic {
        return 301 /classic/;
    }

    # API REST do Scraper (jobs, status, download)
    location /api/ {
        proxy_pass $scraper_backend;
        include /etc/nginx/conf.d/scraper-proxy.inc;
    }

    location /jobs {
        proxy_pass $scraper_backend;
        include /etc/nginx/conf.d/scraper-proxy.inc;
    }

    location /download {
        proxy_pass $scraper_backend;
        include /etc/nginx/conf.d/scraper-proxy.inc;
    }

    location /scrape {
        proxy_pass $scraper_backend;
        include /etc/nginx/conf.d/scraper-proxy.inc;
    }

    location /delete {
        proxy_pass $scraper_backend;
        include /etc/nginx/conf.d/scraper-proxy.inc;
    }

    location /static/ {
        proxy_pass $scraper_backend;
        include /etc/nginx/conf.d/scraper-proxy.inc;
    }

    # Proxy Reverso para Listas e Guias Regionais
    location /g123-proxy/ {
        rewrite ^/g123-proxy/(.*) /$1 break;
        proxy_pass https://g123.com.br;
        proxy_set_header Host g123.com.br;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        
        # Headers CORS
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # Proxy Universal para qualquer URL informada pelo usuário
    location /web-proxy/ {
        resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
        set $target_url $arg_url;
        proxy_pass $target_url;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' '*' always;
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }
}
